name: Build & Publish Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.1, v1.1.0)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: groupsave/mobile/package-lock.json

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Mobile Dependencies
        working-directory: groupsave/mobile
        run: npm ci

      - name: 🚀 Prebuild Android native project
        working-directory: groupsave/mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK
        working-directory: groupsave/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📋 Find generated APK
        id: find_apk
        run: |
          APK_PATH=$(find groupsave/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./GrouSave-${{ github.ref_name || github.event.inputs.version }}.apk
          echo "apk_path=./GrouSave-${{ github.ref_name || github.event.inputs.version }}.apk" >> $GITHUB_OUTPUT

      - name: 🏷️ Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: Release ${{ github.ref_name || github.event.inputs.version }}
          body: |
            ## 🚀 GroupSave ${{ github.ref_name || github.event.inputs.version }}
            
            ### What's New:
            - Hyperlocal Group-Buying and Individual Booking flow
            - Connected to live backend at https://eklakshya.onrender.com
            - Performance optimizations and bug fixes
            
            ### Installation:
            Download and install the APK attached below on your Android device.
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

